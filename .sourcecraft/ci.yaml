on:
  push:
    - workflows: [checks]
      filter:
        branches: [main]

  pull_request:
    - workflows: [checks]
      filter:
        target_branches: [main]

workflows:
  checks:
    tasks:
      - lint
      - syntax-check
      - tests

tasks:
  - name: lint
    cubes:
      - name: ruff
        image: python:3.11-slim
        script:
          - pip install --quiet ruff
          - ruff check . --exclude "*.ipynb"

  - name: syntax-check
    cubes:
      - name: compileall
        image: python:3.11-slim
        script:
          - python -m compileall -q .

  - name: tests
    cubes:
      - name: pytest
        image: python:3.11-slim
        script:
          - apt-get update && apt-get install -y --no-install-recommends libsndfile1 libgomp1
          - pip install --quiet -r requirements.txt pytest
          - python -m pytest tests/ -v
